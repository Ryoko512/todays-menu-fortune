<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日の献立占い</title>
  <meta name="description" content="ボタンを押すだけで、今日の献立と簡単レシピが見つかる献立占い。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d86f45'/%3E%3Cpath d='M17 17v15m6-15v15m-3-15v30M45 17c-8 3-8 17 0 19v11' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--cream:#fffaf1;--paper:#fffefb;--brown:#3d2418;--sage:#6e8b68;--sage-soft:#edf3e9;--orange:#d86f45;--orange-dark:#b9502c;--line:#eadfd3;--shadow:0 18px 50px rgba(89,58,35,.12)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 8% 5%,#f6e7cf 0,transparent 25%),radial-gradient(circle at 92% 92%,#e6efdf 0,transparent 24%),var(--cream);color:var(--brown);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}
    button{font:inherit}
    .shell{width:min(1420px,calc(100% - 32px));margin:auto;padding:14px 0 30px}
    header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;text-align:center;margin-bottom:14px}
    .header-center{min-width:min(620px,54vw)}
    .header-note{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#8a5c43;font-size:.94rem;line-height:1.55;letter-spacing:.08em}
    .header-note.left{text-align:left;transform:rotate(-3deg);padding-left:28px}.header-note.right{text-align:right;transform:rotate(3deg);padding-right:28px}
    .title-row{display:flex;align-items:center;justify-content:center;gap:18px}.title-leaf{color:#789873;font-size:2rem}
    .eyebrow{color:var(--orange-dark);font-weight:700;letter-spacing:.08em;margin:0 0 6px}
    h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2rem,4vw,3rem);margin:0;letter-spacing:.06em}
    .lead{font-size:.98rem;line-height:1.6;margin:6px auto 0;max-width:620px;color:#72584a}
    .fortune-box{background:rgba(255,254,251,.94);border:1px solid rgba(234,223,211,.8);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;position:relative}
    .fortune-box::before,.fortune-box::after{position:absolute;z-index:0;color:#8aa083;font-size:3rem;opacity:.7;pointer-events:none}.fortune-box::before{content:"❦";left:22px;bottom:2px;transform:rotate(-25deg)}.fortune-box::after{content:"❦  ·  ·  ·";right:20px;bottom:4px;transform:rotate(15deg)}
    .start{min-height:720px;text-align:center;padding:38px 40px 390px;position:relative;background:linear-gradient(to bottom,rgba(255,254,251,.98) 0 37%,rgba(255,254,251,.58) 48%,transparent 66%),url('assets/cover-table.png') center bottom/cover no-repeat}
    .start-inner{position:relative;z-index:1;max-width:680px;margin:auto}
    .start h2{font-size:clamp(1.65rem,4vw,2.35rem);margin:0 0 12px}
    .start p{line-height:1.8;color:#72584a;margin:0 0 26px}
    .primary{border:0;border-radius:999px;background:linear-gradient(135deg,var(--orange),#c85e36);color:#fff;font-weight:800;font-size:1.12rem;padding:17px 34px;cursor:pointer;box-shadow:0 10px 22px rgba(216,111,69,.28);transition:.2s transform,.2s box-shadow}
    .primary:hover{transform:translateY(-2px);box-shadow:0 13px 26px rgba(216,111,69,.34)}.primary:active{transform:translateY(1px)}.primary:focus-visible{outline:4px solid #f1c1a9;outline-offset:3px}
    .result{display:none;padding:10px}.result.show{display:block;animation:rise .55s ease both}.start.hide{display:none}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
    .photo-frame{aspect-ratio:3/2;border-radius:20px;overflow:hidden;position:relative;background:#f3eadf}
    .dish-photo{display:block;width:100%;height:100%;object-fit:cover}
    .hero-copy{padding:20px 22px 14px;display:flex;flex-direction:column;justify-content:center}
    .label{display:inline-flex;align-items:center;align-self:flex-start;background:var(--orange);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;margin-bottom:14px}
    h2#dishName{font-size:clamp(1.7rem,3vw,2.65rem);line-height:1.3;margin:0 0 16px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
    .message{background:var(--sage-soft);border-radius:18px;padding:16px 18px;border-left:5px solid var(--sage)}
    .message strong{display:block;color:#557350;margin-bottom:5px}.message p{font-size:1rem;line-height:1.55;margin:0;font-weight:600}
    .details{display:grid;grid-template-columns:.92fr 1.08fr;gap:14px;margin:14px 10px 0}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .card h3{margin:0;padding:11px 18px;color:#fff;font-size:1.02rem}.ingredients h3{background:var(--sage)}.steps h3{background:var(--orange)}
    .ingredient-content{display:grid;grid-template-columns:minmax(0,1fr) 135px;gap:10px;align-items:center;padding-right:12px}
    .ingredient-photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:13px;background:#fff8ee}
    .ingredients ul,.steps ol{margin:0;padding:10px 8px 12px 18px;list-style:none}.ingredients li{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:.92rem}.ingredients li:last-child{border:0}.ingredients b{white-space:nowrap}
    .steps ol{counter-reset:step}.steps li{counter-increment:step;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:6px 0;line-height:1.45;font-size:.92rem}.steps li::before{content:counter(step);width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#f8ddcf;color:var(--orange-dark);font-weight:800}
    .time{margin:0 16px 12px;background:#f8f3ea;border-radius:11px;padding:8px;text-align:center;font-size:.92rem;font-weight:700}
    .actions{text-align:center;padding:16px 0 8px}.note{font-size:.82rem;color:#8b7467;margin:8px 0 0}
    .back{display:inline-block;margin-top:26px;color:#5c6f57;text-decoration:none;font-weight:700}.back:hover{text-decoration:underline}
    @media(min-width:901px){
      .result{padding:10px 12px 8px}
      .result-grid{grid-template-columns:49% 51%;gap:0}
      .photo-frame{height:min(68vh,670px);aspect-ratio:auto;border-radius:22px}
      .hero-copy{padding:34px 26px 0 26px;min-height:340px;justify-content:flex-start}
      .label{margin-top:8px}
      .details{grid-template-columns:.92fr 1.08fr;gap:14px;margin:14px 10px 0}
      .card{box-shadow:0 12px 30px rgba(74,48,31,.08)}
      .actions{padding-top:20px}
    }
    @media(max-width:900px){.shell{width:min(100% - 20px,680px);padding-top:18px}header{display:block;margin-bottom:16px}.header-note,.title-leaf{display:none}.header-center{min-width:0}.lead{font-size:.98rem}.fortune-box{border-radius:22px}.fortune-box::before,.fortune-box::after{display:none}.start{min-height:650px;padding:28px 20px 380px;background-position:center bottom;background-size:auto 430px}.result-grid{grid-template-columns:1fr;gap:0}.photo-frame{height:auto;aspect-ratio:3/2;border-radius:18px}.hero-copy{padding:24px 14px 8px}.details{grid-template-columns:1fr;gap:14px;margin:14px 0 0}.result{padding:9px}.ingredient-content{grid-template-columns:1fr 130px}.ingredients li{font-size:.92rem}.primary{width:100%;max-width:360px}.actions{padding:20px 4px 8px}}
    @media(max-width:430px){.ingredient-content{grid-template-columns:1fr;padding-right:0}.ingredient-photo{width:calc(100% - 32px);margin:0 16px 18px}.ingredients ul{padding-right:24px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
    .shell{display:block;width:100%;max-width:none;margin:0;padding:0}
    .shell>header,.shell>.fortune-box,.shell>.back{display:none}
    .visual-app{width:min(1586px,100%);margin:0 auto;background:#fffaf1}
    .visual-stage{position:relative;width:100%;line-height:0}
    .visual-screen{display:block;width:100%;height:auto}
    .visual-screen.reveal{animation:screenReveal .45s ease both}
    .visual-button{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:999px;color:transparent;font-size:0}
    .visual-button:focus-visible{outline:4px solid #fff;outline-offset:4px;box-shadow:0 0 0 7px #d86f45}
    .cover-button{left:32.4%;top:31.2%;width:35.2%;height:11.2%}
    .menu-button{left:36.1%;top:90.7%;width:27.4%;height:7.2%}
    .fortune-loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,250,241,.72);backdrop-filter:blur(3px);z-index:3;line-height:1.5}
    .fortune-loading[hidden]{display:none}
    .fortune-loading-inner{min-width:min(430px,78%);padding:28px 36px;text-align:center;background:rgba(255,254,251,.95);border:2px solid rgba(216,111,69,.28);border-radius:28px;box-shadow:0 18px 55px rgba(89,58,35,.18);color:#3d2418}
    .fortune-loading-stars{display:flex;justify-content:center;gap:22px;margin-bottom:10px;color:#d86f45;font-size:2rem}
    .fortune-loading-stars span{display:inline-block;animation:twinkle .8s ease-in-out infinite alternate}
    .fortune-loading-stars span:nth-child(2){animation-delay:.2s}.fortune-loading-stars span:nth-child(3){animation-delay:.4s}
    .fortune-loading p{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.15rem,2.5vw,1.7rem);font-weight:700;letter-spacing:.06em}
    @keyframes twinkle{from{opacity:.3;transform:scale(.72) rotate(-8deg)}to{opacity:1;transform:scale(1.18) rotate(8deg)}}
    @keyframes screenReveal{from{opacity:.35;filter:blur(3px)}to{opacity:1;filter:none}}
    .visual-back{display:inline-flex;margin:14px 18px 24px;color:#5c6f57;text-decoration:none;font-weight:700;font-size:1rem;line-height:1.5}
    .visual-back:hover{text-decoration:underline}
    .mobile-result{display:none}
    @media(max-width:700px){
      .visual-app{padding-bottom:8px}.visual-back{font-size:.9rem;margin:12px}.visual-button:focus-visible{outline-width:2px;outline-offset:2px}.fortune-loading-inner{padding:20px 18px;border-radius:20px}.fortune-loading-stars{font-size:1.5rem;gap:16px}
      .visual-stage.mobile-result-active>.visual-screen,.visual-stage.mobile-result-active>.menu-button{display:none}
      .visual-stage.mobile-result-active .mobile-result{display:block;line-height:0;background:#fffaf1}
      .mobile-panel{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:#fffaf1}
      .mobile-panel img{position:absolute;top:0;width:200%;height:100%;max-width:none;object-fit:fill}
      .mobile-panel.left img{left:0}.mobile-panel.right img{left:-100%}
      .mobile-again-wrap{padding:16px 18px 10px;text-align:center;line-height:1.5}
      .mobile-again{width:100%;max-width:360px;border:0;border-radius:999px;background:linear-gradient(135deg,#d86f45,#c85e36);color:#fff;font-weight:800;font-size:1.05rem;padding:15px 24px;box-shadow:0 8px 20px rgba(216,111,69,.28)}
    }
    @media(prefers-reduced-motion:reduce){.fortune-loading-stars span,.visual-screen.reveal{animation:none}}
  </style>

<body>
  <main class="shell">
    <header>
      <div class="header-note left">今日のごはんが<br>ちょっとたのしみになる ──</div>

      </div>
      <div class="header-note right">おいしいごはんで、<br>いい一日を。──</div>
    </header>
    <section class="fortune-box" aria-live="polite">
      <div class="start" id="start">
        <div class="start-inner">
          <h2>今日のごはんを、楽しく決めよう</h2>
          <p>和食・洋食・麺料理など、ひと工夫ある24品から今日の献立を選びます。</p>
          <button class="primary" id="drawButton">今日の献立を占う</button>
        </div>
      </div>
      <div class="result" id="result">
        <div class="result-grid">
          <div class="photo-frame"><img class="dish-photo" id="dishImage" src="assets/dish-01.png" alt=""></div>
          <div class="result-side">
            <div class="hero-copy">
              <span class="label">今日のおすすめは…</span>
              <h2 id="dishName"></h2>
              <div class="message"><strong>今日のひとこと</strong><p id="fortune"></p></div>
            </div>
            <div class="details">
              <section class="card ingredients"><h3>材料（2人分）</h3><div class="ingredient-content"><ul id="ingredients"></ul><img class="ingredient-photo" id="ingredientImage" src="assets/ingredients-01.png" alt=""></div></section>
              <section class="card steps"><h3>作り方</h3><ol id="steps"></ol><p class="time" id="time"></p></section>
            </div>
          </div>
        </div>
        <div class="actions"><button class="primary" id="againButton">もう一度占う</button><p class="note">同じ料理が続かないように選ばれます</p></div>
      </div>
    </section>
    <a class="back" href="https://jsk0512rs.wixsite.com/sora" target="_blank" rel="noopener">← SORA ポートフォリオに戻る</a>
  <div class="visual-app" id="visualApp">

      <button class="visual-button cover-button" id="visualDraw" aria-label="今日の献立を占う">今日の献立を占う</button>
      <button class="visual-button menu-button" id="visualAgain" aria-label="もう一度占う" hidden>もう一度占う</button>
      <div class="mobile-result" id="mobileResult">
        <div class="mobile-panel left"><img id="mobileScreenLeft" src="assets/screens/menu-01.png" alt=""></div>
        <div class="mobile-panel right"><img id="mobileScreenRight" src="assets/screens/menu-01.png" alt=""></div>
        <div class="mobile-again-wrap"><button class="mobile-again" id="mobileAgain">もう一度占う</button></div>
      </div>
      <div class="fortune-loading" id="fortuneLoading" role="status" aria-live="polite" hidden>
        <div class="fortune-loading-inner">

          <p>今日の献立を占っています…</p>
        </div>
      </div>
    </div>
    <a class="visual-back" href="https://jsk0512rs.wixsite.com/sora" target="_blank" rel="noopener">← SORA ポートフォリオに戻る</a>
  </div>
